name: Question
description: How to use the kit, or how to read a conformance result.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended discussion is welcome in Discussions too. Don't paste raw logs, configurations, keys or hostnames.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (plan, variant, redacted summarizer lines)
      render: text
